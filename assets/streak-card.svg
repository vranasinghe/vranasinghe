<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200" role="img" aria-label="Contribution Streak"><title>Contribution Streak</title><defs><linearGradient id="accent"><stop stop-color="#00aaff"/><stop offset="1" stop-color="#0055ff"/></linearGradient><clipPath id="bar"><rect width="310" height="10" rx="5"/></clipPath></defs><style>text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#e6edf3}.title{font-size:18px;font-weight:600;fill:#00aaff}.muted{fill:#8b949e;font-size:12px}.row{animation:reveal .5s ease both}@keyframes reveal{from{opacity:0}}@media(prefers-reduced-motion:reduce){.row{animation:none}}</style><rect x=".5" y=".5" width="499" height="199" rx="10" fill="#0d1117" stroke="#30363d"/><text x="20" y="30" class="title">Contribution Streak</text><line x1="166" x2="166" y1="58" y2="180" stroke="#30363d"/><line x1="333" x2="333" y1="58" y2="180" stroke="#30363d"/><text x="83" y="103" text-anchor="middle" font-size="25">1k</text><text x="83" y="128" text-anchor="middle" font-size="13">Total Contributions</text><text x="83" y="148" text-anchor="middle" class="muted">Last 12 months</text><circle cx="250" cy="91" r="31" fill="none" stroke="#30363d" stroke-width="7"/><circle cx="250" cy="91" r="31" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="39.52 194.78" transform="rotate(-90 250 91)"/><text x="250" y="98" text-anchor="middle" font-size="22">14</text><text x="250" y="145" text-anchor="middle" font-size="13">Current Streak</text><text x="250" y="164" text-anchor="middle" class="muted">Nov 11 – Nov 24</text><text x="416" y="103" text-anchor="middle" font-size="25">69</text><text x="416" y="128" text-anchor="middle" font-size="13">Longest Streak</text><text x="416" y="148" text-anchor="middle" class="muted">Aug 8 – Oct 15</text></svg>
