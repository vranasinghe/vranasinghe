<svg xmlns="http://www.w3.org/2000/svg" width="500" height="200" viewBox="0 0 500 200" role="img" aria-label="GitHub Statistics"><title>GitHub Statistics</title><defs><linearGradient id="accent"><stop stop-color="#00aaff"/><stop offset="1" stop-color="#0055ff"/></linearGradient><clipPath id="bar"><rect width="310" height="10" rx="5"/></clipPath></defs><style>text{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',sans-serif;fill:#e6edf3}.title{font-size:18px;font-weight:600;fill:#00aaff}.muted{fill:#8b949e;font-size:12px}.row{animation:reveal .5s ease both}@keyframes reveal{from{opacity:0}}@media(prefers-reduced-motion:reduce){.row{animation:none}}</style><rect x=".5" y=".5" width="499" height="199" rx="10" fill="#0d1117" stroke="#30363d"/><text x="20" y="30" class="title">GitHub Statistics</text><g transform="translate(20 58)"><g class="row"><text font-size="13">Total stars earned</text><text x="265" text-anchor="end" font-size="13" font-weight="600">1</text></g></g><g transform="translate(20 85)"><g class="row"><text font-size="13">Commits (last 12 months)</text><text x="265" text-anchor="end" font-size="13" font-weight="600">551</text></g></g><g transform="translate(20 112)"><g class="row"><text font-size="13">Pull requests</text><text x="265" text-anchor="end" font-size="13" font-weight="600">66</text></g></g><g transform="translate(20 139)"><g class="row"><text font-size="13">Issues</text><text x="265" text-anchor="end" font-size="13" font-weight="600">0</text></g></g><g transform="translate(20 166)"><g class="row"><text font-size="13">Most active weekday</text><text x="265" text-anchor="end" font-size="13" font-weight="600">Sunday</text></g></g><circle cx="405" cy="103" r="48" fill="none" stroke="#30363d" stroke-width="7"/><circle cx="405" cy="103" r="48" fill="none" stroke="url(#accent)" stroke-width="7" stroke-linecap="round" stroke-dasharray="301.59 301.59" transform="rotate(-90 405 103)"/><text x="405" y="103" text-anchor="middle" font-size="20" font-weight="600">1.1k</text><text x="405" y="122" text-anchor="middle" class="muted">contributions</text></svg>
