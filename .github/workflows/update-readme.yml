name: Update profile
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**', '.github/workflows/update-readme.yml']
permissions:
  contents: write
concurrency:
  group: update-readme
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Collect data
        run: node scripts/collect-data.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_TOKEN: ${{ secrets.PROFILE_TOKEN }}
      - run: node scripts/generate-contribution-graph.mjs
      - run: node scripts/generate-cards.mjs
      - run: node scripts/update-readme.mjs
      - run: node scripts/check-readme.mjs
      - name: Commit and push changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md assets/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: refresh profile stats and activity'
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort || true
            sleep "$attempt"
          done
          exit 1
