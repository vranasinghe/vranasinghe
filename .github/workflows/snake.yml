name: Generate snake animation
on:
  schedule:
    - cron: '41 */12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/snake.yml']
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: vranasinghe
          outputs: |
            dist/github-contribution-grid-snake-blue.svg?color_snake=#0055ff
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00aaff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
